<head>

<title>易搜设置 · 交互原型</title>
<style>
  :root {

  select { appearance: none; padding-inline-end: 30px; background: var(--card) url('../assets/icons/tabler/chevron-down.svg') right 9px center / 14px no-repeat; }
  @supports (appearance: base-select) and selector(::picker(select)) {
    select, select::picker(select) { appearance: base-select; }
    select { padding-inline-end: 9px; background: var(--card); }

    select:open::picker-icon { rotate: 180deg; }

    select::picker(select) {
      position: fixed; inset: auto; position-area: none; position-try-fallbacks: none;
      top: var(--picker-top, anchor(bottom));
      left: var(--picker-left, anchor(left));
      inline-size: var(--picker-width, anchor-size(width)); min-inline-size: 0;
    }

    }

    }

  .font-dialog { width: min(620px, calc(100vw - 30px)); }
  .font-dialog[open] { display: flex; flex-direction: column; overflow: hidden; }
  .font-dialog .dialog-body { min-height: 0; gap: 15px; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .font-dialog .dialog-footer { flex: none; }
  .font-dialog .dialog-footer .button { min-width: 84px; }
  .font-columns { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.15fr) minmax(0, .85fr); gap: 12px; }
  .font-field { display: grid; grid-template-rows: auto var(--control-height) auto; gap: 5px; min-width: 0; }
  .font-field-title { font-size: 13px; font-weight: 600; }
  .font-current { display: flex; align-items: center; padding: 0 9px; border: 1px solid var(--edge); border-radius: var(--control-radius); background: var(--card); overflow-wrap: anywhere; }
  .font-options { height: 187px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: #9ca6b2 transparent; padding: 3px; border: 1px solid var(--edge); border-radius: var(--control-radius); background: var(--card); }
  .font-option { display: block; position: relative; cursor: pointer; min-width: 0; }
  .font-option input[type=radio] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .font-option span { display: block; padding: 4px 8px; border-radius: 4px; overflow-wrap: anywhere; transition: background var(--motion); }
  .font-option:hover span { background: var(--hover); }
  .font-options .font-option span { padding-inline-start: 13px; }
  .font-options .font-option input:checked + span { background: #edf0f4; }
  .font-options .font-option input:checked + span::before { content: ""; position: absolute; inset-inline-start: 3px; top: 50%; width: 3px; height: 15px; border-radius: 2px; background: var(--accent); transform: translateY(-50%); }
  @supports selector(::-webkit-scrollbar) {
    .font-options { scrollbar-width: auto; scrollbar-color: auto; }
    .font-options::-webkit-scrollbar { width: 8px; }
    .font-options::-webkit-scrollbar-thumb { background: #9299a4; border: 2px solid var(--card); border-radius: 8px; }
    .font-options::-webkit-scrollbar-thumb:hover { background: #727c8b; }
    .font-options::-webkit-scrollbar-button { display: none; }
  }
  .font-option input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
  .font-empty { padding: 5px 8px; }
  .font-sample { display: grid; place-items: center; min-height: 100px; padding: 10px; border: 1px solid var(--edge); border-radius: var(--control-radius); background: var(--card); text-align: center; }
  .font-sample span { max-width: 100%; line-height: 1.35; overflow-wrap: anywhere; }
  .font-script-options { display: flex; flex-wrap: wrap; gap: 3px; }
  .font-script-options .font-option span { padding: 5px 10px; border: 1px solid var(--edge); background: var(--card); }
  .font-script-options .font-option:hover span { background: var(--hover); }
  .font-script-options .font-option input:checked + span { border-color: var(--accent); background: var(--tint); box-shadow: none; }
  .font-more { justify-self: start; font-size: 13px; }
  @media (max-width: 540px) {
    .font-dialog .dialog-body { gap: 11px; }
    .font-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .font-family-field { grid-column: 1 / -1; }
    .font-options { height: 110px; }
    .font-sample { min-height: 74px; }
  }
  @keyframes reveal { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  [data-size=compact] .body { grid-template-columns: 147px minmax(0,1fr); }
  [data-size=compact] .view { padding: 17px 17px 25px; }
  [data-size=compact] .rail { padding: 7px 8px; gap: 1px; }
  [data-size=compact] .nav { min-height: 33px; }
  @container (max-width: 450px) {
    .appearance-menu { grid-template-columns: 1fr; }
    .menu-preview { min-height: 91px; }
    .row.wrap { flex-wrap: wrap; }
    .row.wrap .actions { justify-content: flex-start; }
    .shortcut-control { flex: 0 1 100%; }
  }
  @media (max-width: 720px) {
    .prototype { width: calc(100vw - 18px); }
    .body, [data-size=compact] .body { grid-template-columns: 138px minmax(0,1fr); }
    .view { padding: 17px 16px 24px; }
    .rail { padding: 9px 7px; }
    .engine-line { grid-template-columns: 24px minmax(0,1.2fr) minmax(42px,.55fr) minmax(31px,.65fr) 42px 33px; gap: 5px; padding-inline: 8px; }
    .engine-line .engine-grip { width: 24px; }
    .history-row .actions { gap: 2px; }
  }
  @media (max-width: 510px) {
    .prototype { width: calc(100vw - 12px); }
    .body, [data-size=compact] .body { grid-template-columns: 49px minmax(0,1fr); }
    .rail, [data-size=compact] .rail { padding: 6px 4px; }
    .nav { justify-content: center; padding: 5px; min-height: 38px; }
    .nav span:not(.icon), .preview-label { display: none; }
    .view, [data-size=compact] .view { padding: 15px 10px 22px; }
    .field-grid, .engine-fields { grid-template-columns: 1fr; }
    .row { gap: 7px; padding-inline: 8px; }
    .row.wrap { flex-wrap: wrap; }
    .row.wrap .actions { width: 100%; justify-content: flex-start; }
    .row > .icon { width: 16px; height: 16px; }
    .brand-icon { width: 18px; height: 18px; }
    .engine-name { gap: 4px; }
    .engine-line { font-size: 12px; }
    .button { padding-inline: 7px; }
    .search-field { width: 100%; }
    .history-row .repeat-label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    select::picker(select), select::picker-icon { transition: none !important; }
  }
  @media (forced-colors: active) {
    .switch { forced-color-adjust: none; background: ButtonFace; border-color: ButtonText; }
    .switch::after { background: ButtonText; }
    .switch[aria-checked=true] { background: Highlight; border-color: Highlight; }
    .switch[aria-checked=true]::after { background: HighlightText; }
    .nav[aria-current=page], .segment button[aria-pressed=true] { border-color: Highlight; }
  }
</style>
</head>
<body>
<div class="prototype" data-size="regular" id="prototype">
  <div class="preview-bar">
    <span class="preview-label">原型预览</span>
    <div class="segment" role="group" aria-label="原型版本">
      <button type="button" data-edition="full" aria-pressed="true">Full</button>
      <button type="button" data-edition="lite" aria-pressed="false">Lite</button>
    </div>
    <div class="segment" role="group" aria-label="窗口尺寸">

    </div>
  </div>
  <div class="window">
    <header class="titlebar" id="titlebar"></header>
    <div class="body">
      <nav class="rail" id="nav" aria-label="设置页面"></nav>
      <main class="content" id="content" aria-label="设置内容"></main>
    </div>
  </div>
</div>
<div class="menu" id="engine-menu" aria-label="搜索引擎操作" hidden></div>
<dialog id="dialog"></dialog>

  if (!menu.contains(event.target) && button !== state.engineMenu) closeMenu();
  if (!button || button.disabled) return;
  if (button.dataset.edition) setEdition(button.dataset.edition);
  if (button.dataset.sizeChoice) setSize(button.dataset.sizeChoice);
  const action = actions[button.dataset.action];
  if (action) action(button.dataset.value, button);
});
document.addEventListener("submit", (event) => {
  if (event.target.id !== "engine-form") return;
  event.preventDefault();
  engineDraft(false);
});
document.addEventListener("input", (event) => {
  const input = event.target;
  if (input.dataset.draft && state.editor) {
    state.editor[input.dataset.draft] = input.value;
    state.editor.dirty = true;
    if (["engine-name", "engine-color", "engine-accent"].includes(input.id)) updateEngineIconPreviews();
    if (input.id === "engine-color") $("#reset-engine-color").disabled = input.value === "#000000";
    if (input.type !== "color") engineFieldError(input.dataset.draft, "");
  }
  if (input.id === "engine-filter") {
    finishEngineDrag(false);
    state.engineFilter = input.value;
    $("#engine-list").innerHTML = engineRows();
  }
  if (input.id === "history-query" || input.id === "history-source") {
    if (event.isComposing) return;
    if (input.id === "history-query") state.historyQuery = input.value;
    else state.historySource = input.value;
    state.historyPage = 0;
    clearTimeout(historyTimer);
    historyTimer = setTimeout(updateHistory, 140);
  }
  if (input.id === "browser-path") {
    state.browserPath = input.value;
    $("#save-browser").disabled = !browserChanged();
    $("#browser-error").textContent = "";
  }
  if (input.id === "ocr-path") {
    state.ocrPath = input.value;
    state.ocrStatus = "initial";
    $("#ocr-status").innerHTML = ocrStatusWithActivePath();
    setFeedback("ocr", "");
  }
});
document.addEventListener("change", (event) => {
  const input = event.target;
  if (input.id === "language") {
    state.language = input.value;
    $("#apply-language").disabled = prefs.language === state.language;
  }
  if (input.name === "browser") {
    state.browser = input.value;
    state.feedback.delete("browser");
    refresh(`#browser-${input.value}`);
  }
  if (input.id === "selection-engine") prefs.selectionEngine = input.value;
  if (input.id === "selection-action") prefs.selectionAction = input.value;
});
function finishIconSize(input, commit, step = 0) {
  const value = input.value.trim();
  if (commit && /^[0-9]+$/.test(value) && Number(value) >= minIconSize) {
    prefs.iconSize = Math.min(maxIconSize, Number(value));
  }
  prefs.iconSize = Math.max(minIconSize, Math.min(maxIconSize, prefs.iconSize + step));
  $(".search-preview").style.setProperty("--engine-size", `${prefs.iconSize}px`);
  input.value = prefs.iconSize;
  input.setAttribute("aria-valuenow", prefs.iconSize);
  const decrease = $("#decrease-icon-size");
  const increase = $("#increase-icon-size");
  if ((prefs.iconSize === minIconSize && document.activeElement === decrease) ||
      (prefs.iconSize === maxIconSize && document.activeElement === increase)) {
    input.focus();
  }
  decrease.disabled = prefs.iconSize === minIconSize;
  increase.disabled = prefs.iconSize === maxIconSize;
}
document.addEventListener("focusout", (event) => {
  if (event.target.id === "engine-icon-size" && $(".search-preview")) finishIconSize(event.target, true);
  const recording = state.recording;
  if (recording?.mode === "recording" && event.target.id === `record-${recording.key}`) cancelRecording();
});
document.addEventListener("keyup", (event) => {
  const recording = state.recording;
  if (recording?.mode === "recording" && event.target.id === `record-${recording.key}`) {
    showShortcutModifiers(event.target, shortcutModifiers(event));
  }
});
document.addEventListener("animationend", (event) => {
  if (event.animationName === "shortcut-shake") event.target.classList.remove("invalid");
});
window.addEventListener("blur", () => {
  if (state.recording?.mode === "recording") cancelRecording();
});
document.addEventListener("paste", (event) => {
  if (event.target.id !== "excluded-app") return;
  const value = event.clipboardData.getData("text");
  if (!/[,，;\n]/.test(value)) return;
  event.preventDefault();
  addExclusions(value);
});
document.addEventListener("keydown", (event) => {
  if (dialog.open || event.isComposing) return;
  if (state.engineDrag) {
    if (event.key === "Escape") {
      event.preventDefault();
      finishEngineDrag(false, true);
    }
    return;
  }
  const engineRow = event.target.closest("[data-engine-id]");
  if (engineRow && event.altKey && ["ArrowUp", "ArrowDown"].includes(event.key)) {
    event.preventDefault();
    const after = event.key === "ArrowDown";
    const sibling = after ? engineRow.nextElementSibling : engineRow.previousElementSibling;
    if (sibling?.dataset.engineId) reorderEngine(engineRow, sibling, after);
    return;
  }
  if (event.target.id === "engine-icon-size" && ["Enter", "Escape"].includes(event.key)) {
    event.preventDefault();
    finishIconSize(event.target, event.key === "Enter");
    return;
  }
  if (event.target.id === "engine-icon-size" && ["ArrowUp", "ArrowDown"].includes(event.key)) {
    event.preventDefault();
    finishIconSize(event.target, true, event.key === "ArrowUp" ? 1 : -1);
    return;
  }
  if (state.engineMenu) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeMenu(true);
      return;
    }
    if (event.key === "Tab") {
      closeMenu(true);
      return;
    }
    if (["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) {
      event.preventDefault();
      const buttons = $$("button:not(:disabled)", menu);
      const current = buttons.indexOf(document.activeElement);
      const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 :
        (current + (event.key === "ArrowUp" ? -1 : 1) + buttons.length) % buttons.length;
      buttons[next]?.focus();
      return;
    }
  }
  if (captureKey(event)) return;
  const navigation = event.target.closest(".nav");
  if (navigation && ["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) {
    event.preventDefault();
    const items = $$(".nav", nav);
    const index = items.indexOf(navigation);
    const next = event.key === "Home" ? 0 : event.key === "End" ? items.length - 1 :
      (index + (event.key === "ArrowUp" ? -1 : 1) + items.length) % items.length;
    items[next].focus();
    return;
  }
  if (event.key === "Escape" && state.editor) {
    actions["cancel-engine"]();
    return;
  }
  if (event.key === "Enter" && event.target.id === "excluded-app") {
    event.preventDefault();
    addExclusions(event.target.value);
  }
  const row = event.target.closest("[data-history-row]");
  if (row && event.target === row && ["Enter", "Delete"].includes(event.key)) {
    event.preventDefault();
    actOnHistory(event.key === "Enter" ? "repeat-search" : "delete-history", row.dataset.historyRow);
  }
});
content.addEventListener("scroll", () => closeMenu(), { passive: true });
window.addEventListener("resize", () => {
  finishEngineDrag(false);
  closeMenu(true);
});

document.documentElement.lang = uiLanguage();
drawChrome();
refresh();
if (location.hash === "#add-engine") {
  changePage("engines");
  beginEditor();
} else if (location.hash === "#appearance") {
  changePage("appearance");
}
</script>
</body>
</html>
