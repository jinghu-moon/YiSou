[package]
name = "yisou-nsh-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "YiSou"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
nsh-core = { path = "../../refer/nsh-main/crates/nsh-core", features = ["svg"] }
nsh-base = { path = "../../refer/nsh-main/crates/nsh-base", default-features = false }
nsh-platform-windows = { path = "../../refer/nsh-main/crates/nsh-platform-windows", default-features = false, features = ["svg"] }
yisou = { path = "../.." }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
