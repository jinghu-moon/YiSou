<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>易搜搜索框 · 交互原型</title>
<style>
  :root {
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: #20242b;
    --accent: #1f75db;
    --edge: #c9ced6;
    --hover: #e2e8f1;
    --ease-menu-in: cubic-bezier(0,0,.38,.9);
    --ease-menu-out: cubic-bezier(.2,0,1,.9);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100dvh; background: radial-gradient(ellipse at 50% 0, #303d48, #1c2029 62%); }
  main { position: relative; width: min(580px, calc(100% - 32px)); margin: 0 auto; padding: clamp(36px, 16dvh, 140px) 0 24px; }
  button, input { font: inherit; color: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .search-bar {
    display: flex; align-items: center; min-height: 54px; padding: 6px 11px 6px 19px; gap: 8px;
    background: #f4f6fbdf; backdrop-filter: blur(18px); border: 1px solid #ffffff94; border-radius: 9px;
    box-shadow: 0 4px 20px #0003;
  }
  .search-bar input { flex: 1; min-width: 0; padding: 0; background: transparent; border: 0; outline: none; font-size: 20px; }
  .search-bar input::placeholder { color: #535f6d; }
  .search-bar:has(input:focus-visible) { border-color: #8db7ee; }
  .trigger { width: 38px; height: 38px; padding: 0; flex: none; display: grid; place-items: center; border: 1px solid transparent; border-radius: 8px; background: #f8fbff52; cursor: pointer; }
  .trigger img { width: 24px; height: 24px; }
  .trigger:hover, .trigger[aria-expanded=true] { border-color: var(--accent); background: #e6eefb; }
  .engine-grid {
    position: absolute; right: 12px; width: min(432px, 100%); padding: 9px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;
    overflow: auto; overscroll-behavior: contain; scrollbar-width: thin;
    background: #eef1f6; border: 1px solid var(--edge); border-radius: 9px;
    box-shadow: 0 12px 34px #0003;
    opacity: 0; transform: translateY(var(--popup-offset, -4px)) scale(.98);
    transform-origin: var(--popup-origin, top center);
    transition: opacity 100ms var(--ease-menu-out), transform 100ms var(--ease-menu-out), display 100ms allow-discrete;
  }
  .engine-grid[data-popup-side=above] { --popup-offset: 4px; --popup-origin: bottom center; }
  .engine-grid:not([hidden]) {
    opacity: 1; transform: none;
    transition-duration: 200ms;
    transition-timing-function: var(--ease-menu-in);
    @starting-style { opacity: 0; transform: translateY(var(--popup-offset, -4px)) scale(.98); }
  }
  .engine-grid[hidden] { pointer-events: none; }
  .engine-tile { position: relative; display: grid; place-items: center; min-width: 0; aspect-ratio: 1; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: background 120ms, border-color 120ms; }
  .engine-tile:hover { background: var(--hover); }
  .engine-tile[aria-pressed=true] { border-color: #d5dce6; background: #fafbfd; }
  .engine-tile[aria-pressed=true]::after { content: ""; position: absolute; bottom: 6px; width: 16px; height: 3px; border-radius: 3px; background: var(--accent); }
  .engine-tile img { width: min(36px, 66%); aspect-ratio: 1; object-fit: contain; }
  .engine-add { color: var(--accent); font-size: 18px; text-decoration: none; }
  @media (max-width: 470px) {
    .engine-grid { right: 0; }
  }
  @media (max-width: 350px) {
    .engine-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <form class="search-bar" id="search" role="search">
    <input id="query" type="search" aria-label="搜索网页" placeholder="搜索网页…" autocomplete="off" autofocus>
    <button id="engine-trigger" class="trigger" type="button" aria-controls="engine-grid" aria-expanded="true">
      <img alt="" src="../assets/icons/bing.svg">
    </button>
  </form>
  <div id="engine-grid" class="engine-grid" role="group" aria-label="搜索引擎">
    <a class="engine-tile engine-add" href="settings.html#add-engine" title="添加搜索引擎" aria-label="添加搜索引擎">+</a>
  </div>
</main>
<script>
const engines = [
  ["bing", "必应", "https://www.bing.com/search?q=%s"],
  ["baidu", "百度", "https://www.baidu.com/s?wd=%s"],
  ["google", "Google", "https://www.google.com/search?q=%s"],
  ["bilibili", "哔哩哔哩", "https://search.bilibili.com/all?keyword=%s"],
  ["youtube", "YouTube", "https://www.youtube.com/results?search_query=%s"],
  ["zhihu", "知乎", "https://www.zhihu.com/search?type=content&q=%s"],
  ["reddit", "Reddit", "https://www.reddit.com/search/?q=%s"],
  ["github", "GitHub", "https://github.com/search?q=%s"],
  ["stackoverflow", "Stack Overflow", "https://stackoverflow.com/search?q=%s"],
  ["taobao", "淘宝", "https://s.taobao.com/search?q=%s"],
  ["amazon", "Amazon", "https://www.amazon.com/s?k=%s"],
  ["x", "X", "https://x.com/search?q=%s"],
];
const form = document.querySelector("#search");
const query = document.querySelector("#query");
const trigger = document.querySelector("#engine-trigger");
const grid = document.querySelector("#engine-grid");
const addEngine = grid.querySelector(".engine-add");
const iconPath = (id) => `../assets/icons/${id}.svg`;

const tiles = engines.map(([id, name], index) => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "engine-tile";
  button.title = name;
  button.setAttribute("aria-label", name);
  const image = document.createElement("img");
  image.alt = "";
  image.src = iconPath(id);
  button.append(image);
  button.onclick = () => {
    selectEngine(index);
    showEngines(false);
    query.focus();
  };
  return button;
});
addEngine.before(...tiles);
const gridItems = [...tiles, addEngine];
let selected = 0;

function selectEngine(index) {
  selected = index;
  const [id, name] = engines[index];
  trigger.querySelector("img").src = iconPath(id);
  trigger.setAttribute("aria-label", `搜索引擎：${name}`);
  tiles.forEach((tile, position) => tile.setAttribute("aria-pressed", String(position === index)));
}
function positionEngineGrid() {
  const bounds = form.getBoundingClientRect();
  const below = innerHeight - bounds.bottom - 15;
  const above = bounds.top - 15;
  grid.style.maxHeight = "";
  const opensAbove = grid.offsetHeight > below && above > below;
  grid.dataset.popupSide = opensAbove ? "above" : "below";
  grid.style.maxHeight = `${Math.max(0, opensAbove ? above : below)}px`;
  grid.style.top = `${opensAbove ? form.offsetTop - grid.offsetHeight - 7 : form.offsetTop + form.offsetHeight + 7}px`;
}
function showEngines(open) {
  grid.inert = !open;
  grid.hidden = !open;
  trigger.setAttribute("aria-expanded", String(open));
  if (open) positionEngineGrid();
}
selectEngine(selected);
positionEngineGrid();
window.addEventListener("resize", () => {
  if (!grid.hidden) positionEngineGrid();
});
trigger.onclick = () => showEngines(grid.hidden);
form.onsubmit = (event) => {
  event.preventDefault();
  const value = query.value.trim();
  if (!value) return;
  const url = engines[selected][2].replace("%s", encodeURIComponent(value));
  window.open(url, "_blank", "noopener");
  showEngines(false);
};
document.addEventListener("click", (event) => {
  if (!grid.contains(event.target) && !trigger.contains(event.target)) showEngines(false);
});
document.addEventListener("keydown", (event) => {
  if (event.isComposing) return;
  if (event.key === "Escape" && !grid.hidden) {
    event.preventDefault();
    showEngines(false);
    query.focus();
  }
  if (event.key === "ArrowDown" && (event.target === query || event.target === trigger)) {
    event.preventDefault();
    showEngines(true);
    tiles[selected].focus();
  }
});
grid.addEventListener("keydown", (event) => {
  const index = gridItems.indexOf(document.activeElement);
  const columns = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
  const movement = { ArrowUp: -columns, ArrowDown: columns, ArrowLeft: -1, ArrowRight: 1 };
  if (index >= 0 && Object.hasOwn(movement, event.key)) {
    event.preventDefault();
    gridItems[Math.max(0, Math.min(index + movement[event.key], gridItems.length - 1))].focus();
  }
});
</script>
</body>
</html>
