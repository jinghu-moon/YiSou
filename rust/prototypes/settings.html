<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>易搜设置 · 交互原型</title>
<style>
  :root {
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    color: #1a1e26; background: #e7ebf0; color-scheme: light;
    --surface: #f1f3f7; --card: #fafbfd; --edge: #dce1e9; --line: #e5e9ef;
    --muted: #545e6f; --accent: #005fb8; --tint: #e6eef9; --hover: #edf1f7;
    --danger: #9f2e2a; --success: #216749; --motion: 130ms cubic-bezier(.2,.75,.25,1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; overflow: hidden; display: grid; place-items: center; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .48; }
  button, a, input, select { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, p { margin: 0; }
  h1 { font-size: 29px; line-height: 1.28; font-weight: 650; }
  h2 { font-size: 15px; font-weight: 650; }
  .subtle { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
  .prototype { width: min(900px, calc(100vw - 36px)); max-width: 100%; display: grid; gap: 9px; }
  .prototype[data-size=compact] { width: min(667px, calc(100vw - 24px)); }
  .prototype[data-size=large] { width: min(1140px, calc(100vw - 36px)); }
  .preview-bar { display: flex; align-items: center; justify-content: flex-end; gap: 9px; font-size: 12px; color: var(--muted); min-width: 0; }
  .segment { display: inline-flex; align-items: stretch; padding: 2px; gap: 2px; border: 1px solid var(--edge); border-radius: 7px; background: #e9edf3; }
  .segment button { padding: 3px 10px; min-height: 27px; border: 1px solid transparent; border-radius: 5px; background: transparent; white-space: nowrap; }
  .segment button:hover { background: #f3f6fa; }
  .segment button[aria-pressed=true] { border-color: var(--edge); color: var(--accent); background: white; box-shadow: 0 1px 2px #1c284411; }
  .window { height: min(580px, calc(100dvh - 64px)); min-height: 0; overflow: hidden; display: grid; grid-template-rows: 42px minmax(0,1fr); border-radius: 8px; border: 1px solid #cbd2dc; background: var(--surface); box-shadow: 0 16px 44px #34425324, 0 2px 5px #34425316; }
  [data-size=compact] .window { height: min(345px, calc(100dvh - 58px)); }
  [data-size=large] .window { height: min(760px, calc(100dvh - 64px)); }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .appmark { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: white; background: var(--accent); }
  .appmark .icon { width: 14px; height: 14px; }
  .titlebar .tool { margin-left: auto; }
  .body { display: grid; grid-template-columns: 184px minmax(0,1fr); min-height: 0; }
  .rail { display: flex; flex-direction: column; gap: 3px; overflow: auto; scrollbar-width: thin; padding: 16px 11px 12px; border-right: 1px solid var(--edge); }
  .nav { position: relative; display: flex; align-items: center; gap: 10px; min-height: 39px; flex-shrink: 0; padding: 6px 11px; text-align: left; }
  .nav .icon { color: var(--muted); }
  .nav[aria-current=page] { background: var(--tint); color: #154678; font-weight: 650; }
  .nav[aria-current=page] .icon { color: var(--accent); }
  .nav[aria-current=page]::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 17px; background: var(--accent); border-radius: 3px; }
  .nav[data-divider] { margin-top: 10px; }
  .content { min-width: 0; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; scrollbar-width: thin; background: #f7f8fa; }
  .view { max-width: 740px; padding: 25px 26px 32px; margin: 0 auto; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 19px; }
  .page-head > div { min-width: 0; }
  section + section { margin-top: 19px; }
  .section-title { margin-bottom: 7px; }
  .group { border: 1px solid var(--edge); border-radius: 8px; background: var(--card); }
  .row { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 10px 13px; }
  .row + .row, .inset + .row, .row + .inset, .inset + .inset { border-top: 1px solid var(--line); }
  .row > .icon { color: var(--muted); width: 19px; height: 19px; }
  .copy { min-width: 0; flex: 1; overflow-wrap: anywhere; }
  .label { font-weight: 600; }
  .copy .subtle { margin-top: 2px; }
  .actions, .toolbar, .keyset, .inline { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .actions, .inline { flex-wrap: wrap; }
  .actions { justify-content: flex-end; }
  .toolbar { justify-content: space-between; margin-bottom: 12px; }
  .tool, .button, .nav { border-radius: 6px; border: 1px solid transparent; background: transparent; transition: background var(--motion), color var(--motion), border-color var(--motion); }
  .button { min-height: 33px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 10px; border-color: var(--edge); background: #fff; }
  .button:hover:not(:disabled), .tool:hover:not(:disabled), .nav:hover:not([aria-current=page]) { background: var(--hover); }
  .button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .button.accent:hover:not(:disabled) { background: #07529a; }
  .button.danger { color: var(--danger); }
  .button .icon { width: 15px; height: 15px; }
  .tool { display: inline-grid; place-items: center; width: 33px; height: 33px; padding: 0; flex: none; }
  .tool .icon { width: 17px; height: 17px; }
  .switch { width: 42px; height: 23px; padding: 0; flex: none; position: relative; border-radius: 13px; border: 1px solid #777e8b; background: #fff; transition: background var(--motion), border-color var(--motion); }
  .switch::after { content: ""; position: absolute; width: 11px; height: 11px; top: 5px; left: 5px; border-radius: 50%; background: #525d70; transition: transform var(--motion), background var(--motion); }
  .switch[aria-checked=true] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked=true]::after { transform: translateX(19px); background: #fff; }
  input:not([type=radio],[type=color],[type=file]), select { border: 1px solid #cfd6e0; border-radius: 6px; min-height: 34px; background: #fff; padding: 5px 8px; min-width: 0; max-width: 100%; }
  input::placeholder { color: #666f7d; }
  input[aria-invalid=true] { border-color: var(--danger); }
  input[type=color] { padding: 3px; width: 37px; height: 34px; background: white; border: 1px solid var(--edge); border-radius: 6px; }
  input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
  .field { display: grid; gap: 5px; min-width: 0; }
  .field label { font-weight: 600; font-size: 13px; }
  .field .error:empty { display: none; }
  .field-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
  .search-field { position: relative; width: min(100%, 310px); }
  .search-field input { width: 100%; padding-inline-start: 33px !important; }
  .search-field .icon { position: absolute; pointer-events: none; top: 9px; left: 9px; color: var(--muted); width: 16px; height: 16px; }
  .inset { padding: 13px; }
  .stack { display: grid; gap: 12px; }
  .wide { flex: 1; min-width: 0; }
  .path { font: 12px/1.55 Consolas, "Microsoft YaHei UI", monospace; overflow-wrap: anywhere; user-select: text; }
  .error { color: var(--danger); font-size: 12px; overflow-wrap: anywhere; }
  .ok { color: var(--success); }
  .plain-link { color: var(--accent); text-decoration: none; }
  .plain-link:hover { text-decoration: underline; }
  .brand-icon { width: 22px; height: 22px; object-fit: contain; flex: none; }
  .custom-icon { display: inline-grid; place-items: center; border-radius: 6px; background: var(--swatch); color: #fff; font-size: 13px; font-weight: 700; }
  .search-preview { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--edge); border-radius: 8px; padding: 10px 13px; min-height: 49px; background: #fff; font-size: 20px; }
  .search-preview .brand-icon { width: 20px; height: 20px; }
  .sample-grid { display: flex; flex-wrap: wrap; gap: 7px; }
  .sample-tile { display: grid; justify-items: center; align-content: center; gap: 4px; min-width: 67px; min-height: 56px; padding: 6px; border: 1px solid var(--edge); border-radius: 6px; background: #fff; font-size: 12px; }
  .sample-tile:first-child { border-color: #a8c6e7; background: #f2f7ff; }
  .sample-grid[data-names=false] .sample-tile { min-width: 45px; min-height: 44px; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot { display: flex; align-items: center; gap: 5px; min-width: 0; min-height: 30px; max-width: 100%; padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px; background: #f7f9fc; font-size: 12px; }
  .slot span { min-width: 0; overflow-wrap: anywhere; }
  .slot .brand-icon { width: 15px; height: 15px; font-size: 10px; }
  kbd { min-height: 22px; padding: 1px 5px; border: 1px solid #d8dfe9; border-bottom-width: 2px; border-radius: 4px; background: #fff; font: 12px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #344254; white-space: nowrap; }
  .engine-table { margin-top: 13px; }
  .engine-line { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(55px,.6fr) minmax(85px,.8fr) 33px; gap: 9px; min-height: 48px; align-items: center; padding: 6px 11px 6px 13px; }
  .engine-line + .engine-line { border-top: 1px solid var(--line); }
  .engine-line:focus-within, .engine-line:not(.columns):hover { background: #f3f6fa; }
  .engine-line.columns { min-height: 34px; font-size: 12px; color: var(--muted); }
  .engine-name { min-width: 0; display: flex; align-items: center; gap: 9px; }
  .engine-name strong, .alias { min-width: 0; overflow-wrap: anywhere; }
  .states { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; color: var(--accent); font-size: 12px; }
  .states .icon { width: 14px; height: 14px; }
  .form-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
  .keyset { gap: 4px; flex-wrap: wrap; }
  .key-capture { min-height: 34px; flex: 1; padding: 5px 8px; border: 1px dashed #92aac4; border-radius: 6px; background: #f0f6fd; }
  .record-box { min-height: 100px; }
  .record-box .error { min-height: 18px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--edge); background: #f2f5fa; border-radius: 5px; padding: 2px 3px 2px 6px; font-size: 12px; }
  .chip .tool { width: 22px; height: 22px; }
  .chip .icon { width: 13px; height: 13px; }
  .radio-row { cursor: pointer; }
  .radio-row:hover { background: var(--hover); }
  .radio-row:has(input:checked) { background: #edf3fb; }
  .history-row { min-height: 58px; }
  .history-row:focus-within { background: #f3f6fa; }
  .history-row .copy { overflow-wrap: anywhere; }
  .pagination { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: 9px; }
  .empty { text-align: center; padding: 30px 12px; display: grid; justify-items: center; gap: 7px; }
  .empty > .icon { width: 24px; height: 24px; color: #6c7e92; }
  .status-line { display: flex; align-items: center; gap: 7px; min-height: 41px; font-size: 13px; }
  .status-line .icon { width: 16px; height: 16px; }
  .spin { animation: spin 750ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .download-list { display: flex; flex-wrap: wrap; gap: 10px 16px; }
  .download-list .icon { width: 13px; height: 13px; margin-left: 3px; }
  .feedback { min-height: 20px; }
  .menu { position: fixed; z-index: 3; display: grid; gap: 2px; padding: 4px; min-width: 153px; max-height: calc(100dvh - 16px); overflow: auto; border: 1px solid var(--edge); background: #fff; border-radius: 7px; box-shadow: 0 6px 22px #23334c29; animation: reveal var(--motion) both; }
  .menu button { justify-content: flex-start; border-color: transparent; }
  dialog { width: min(455px, calc(100vw - 30px)); max-height: calc(100dvh - 30px); margin: auto; padding: 0; border: 1px solid var(--edge); border-radius: 8px; background: var(--card); color: inherit; box-shadow: 0 9px 34px #23334c35; }
  dialog[open] { animation: reveal var(--motion) both; }
  dialog::backdrop { background: #17243744; }
  .dialog-body { display: grid; gap: 12px; padding: 17px; }
  .dialog-body h2 { font-size: 18px; }
  .dialog-footer { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 11px 17px; }
  @keyframes reveal { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  [data-size=compact] .body { grid-template-columns: 147px minmax(0,1fr); }
  [data-size=compact] .view { padding: 17px 17px 25px; }
  [data-size=compact] .rail { padding: 7px 8px; gap: 1px; }
  [data-size=compact] .nav { min-height: 33px; }
  [data-size=compact] .nav[data-divider] { margin-top: 4px; }
  @media (max-width: 720px) {
    .prototype { width: calc(100vw - 18px); }
    .body, [data-size=compact] .body { grid-template-columns: 138px minmax(0,1fr); }
    .view { padding: 17px 16px 24px; }
    .rail { padding: 9px 7px; }
    .engine-line { grid-template-columns: minmax(0,1.2fr) minmax(43px,.55fr) minmax(54px,.65fr) 33px; gap: 6px; padding-inline: 8px; }
    .history-row .actions { gap: 2px; }
  }
  @media (max-width: 510px) {
    .prototype { width: calc(100vw - 12px); }
    .body, [data-size=compact] .body { grid-template-columns: 49px minmax(0,1fr); }
    .rail, [data-size=compact] .rail { padding: 6px 4px; }
    .nav { justify-content: center; padding: 5px; min-height: 38px; }
    .nav span:not(.icon), .preview-label { display: none; }
    .view, [data-size=compact] .view { padding: 15px 10px 22px; }
    .field-grid { grid-template-columns: 1fr; }
    .row { gap: 7px; padding-inline: 8px; }
    .row.wrap { flex-wrap: wrap; }
    .row.wrap .actions { width: 100%; justify-content: flex-start; }
    .row > .icon { width: 16px; height: 16px; }
    .brand-icon { width: 18px; height: 18px; }
    .engine-name { gap: 4px; }
    .engine-line { font-size: 12px; }
    .button { padding-inline: 7px; }
    .search-field { width: 100%; }
    .history-row .repeat-label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (forced-colors: active) {
    .switch[aria-checked=true]::after { transform: translateX(19px); background: Highlight; }
    .switch::after { forced-color-adjust: none; background: ButtonText; }
    .nav[aria-current=page], .segment button[aria-pressed=true] { border-color: Highlight; }
  }
</style>
</head>
<body>
<div class="prototype" data-size="regular" id="prototype">
  <div class="preview-bar">
    <span class="preview-label">原型预览</span>
    <div class="segment" role="group" aria-label="原型版本">
      <button type="button" data-edition="full" aria-pressed="true">Full</button>
      <button type="button" data-edition="lite" aria-pressed="false">Lite</button>
    </div>
    <div class="segment" role="group" aria-label="窗口尺寸">
      <button type="button" data-size-choice="regular" aria-pressed="true" title="900 × 580">标准</button>
      <button type="button" data-size-choice="compact" aria-pressed="false" title="667 × 345">紧凑</button>
    </div>
  </div>
  <div class="window">
    <header class="titlebar" id="titlebar"></header>
    <div class="body">
      <nav class="rail" id="nav" aria-label="设置页面"></nav>
      <main class="content" id="content" aria-label="设置内容"></main>
    </div>
  </div>
</div>
<div class="menu" id="engine-menu" aria-label="搜索引擎操作" hidden></div>
<dialog id="dialog"></dialog>
<input type="file" id="local-file" hidden>

function uiLanguage() {

function localizeText(text) {
  if (uiLanguage() !== "en") return text;
  const normalized = text.trim();
  const direct = englishStrings.get(normalized);
  if (direct) return text.replace(normalized, direct);
  const patterns = [
    [/^(.+)：更多操作$/, (_, name) => `More actions for ${name}`],
    [/^此组合键已用于「(.+)」。$/, (_, name) => `This shortcut is already assigned to ${englishStrings.get(name) || name}.`],
    [/^缺少文件 · (.+)$/, (_, file) => `Missing file · ${file}`],
    [/^识别模型校验失败 · (.+)$/, (_, file) => `Recognizer failed verification · ${file}`],
    [/^(\d+) 条 · 第 (\d+) \/ (\d+) 页$/, (_, count, page, total) => `${count} results · Page ${page} of ${total}`],
  ];
  for (const [pattern, replacement] of patterns) {
    if (pattern.test(normalized)) return text.replace(pattern, replacement);
  }
  return text;

  const ids = new Set(all.map(({ id }) => id));
  if (!Array.isArray(values) || values.some((id) => !ids.has(id))) throw new Error("置顶列表包含无效引擎。");
  const pins = [...new Set(pack ? [...values, ...prefs.pins] : values)];
  const imported = {};
  if (!pack) {
    for (const [key, value] of Object.entries(prefs)) {
      if (typeof value === "boolean" && typeof data.preferences[key] === "boolean") imported[key] = data.preferences[key];
      if (typeof value === "string" && typeof data.preferences[key] === "string") imported[key] = data.preferences[key];
    }
    if (!ids.has(imported.defaultEngine)) imported.defaultEngine = "bing";
    if (!ids.has(imported.selectionEngine)) imported.selectionEngine = "bing";
    if (Array.isArray(data.preferences.excluded)) imported.excluded = data.preferences.excluded.filter((value) => typeof value === "string");
    if (!demoFolders.some(([path], index) => index === 0 && path === imported.ocrPath)) imported.ocrEnabled = false;
  }
  return { ...imported, custom, pins };
}
async function importConfig(file, pack) {
  try {
    const candidate = previewConfig(JSON.parse(await file.text()), pack);
    openDialog(pack ? "导入搜索引擎包？" : "替换当前配置？", sub(`${file.name} · ${pack ? "合并自定义引擎和置顶顺序。" : "替换此原型中的当前设置。"}`), "导入", () => () => {
      Object.assign(prefs, candidate);
      if (!pack) {
        state.language = prefs.language;
        state.browser = prefs.browser;
        state.browserPath = prefs.browserPath;
        state.exclusion = [...prefs.excluded];
        state.ocrPath = prefs.ocrPath;
        state.ocrStatus = prefs.ocrPath === demoFolders[0][0] ? "ready" : "initial";
      }
      setFeedback("config", `已导入 ${file.name}。`);
      if (state.page === "config") refresh(pack ? "#import-engines" : "#import-config");
    });
  } catch (error) {
    setFeedback("config", `导入失败。${error.message}`);
  }
}

const actions = {
  navigate: (page) => showPage(page),
  expand: () => setSize($("#prototype").dataset.size === "large" ? "regular" : "large"),
  toggle: (key, button) => {
    if (key === "ocrEnabled") return changeOcr(button);
    updateSwitch(button, key);
  },
  "apply-language": () => {
    prefs.language = state.language;
    document.documentElement.lang = uiLanguage();
    setFeedback("general", uiLanguage() === "en" ? "Language preference applied." : "已应用界面语言。");
    drawChrome();
    refresh("#language");
    localize($(".preview-bar"));
  },
  "choose-font": chooseFont,
  "font-file": () => pickFile(".ttf,.otf,.ttc,.otc", loadFont),
  "reset-font": () => {
    setFont("Microsoft YaHei UI");
    refresh("#choose-font");
  },
  names: (value) => {
    prefs.names = value === "true";
    refresh(`#names-${value}`);
  },
  "add-engine": () => beginEditor(),
  "engine-menu": (id, anchor) => openMenu(anchor, id),
  "cancel-engine": () => guardEditor(() => exitEditor(state.editor.id ? `#menu-${state.editor.id}` : "#add-engine")),
  "test-engine": () => engineDraft(true),
  "icon-file": () => pickFile(".svg,.png,.jpg,.jpeg,.bmp,.ico,.webp", loadEngineIcon),
  "remove-icon": () => {
    delete state.editor.image;
    state.editor.dirty = true;
    state.feedback.delete("icon");
    refresh("#icon-file");
  },
  "clear-engines": () => {
    state.engineFilter = "";
    refresh("#engine-filter");
  },
  "start-record": startRecording,
  "cancel-record": () => stopRecording(false),
  "save-key": () => stopRecording(true),
  "clear-key": (key) => {
    prefs[key] = key === "main" ? "双击左 Alt" : "";
    refresh(`#record-${key}`);
  },
  "goto-ocr": () => {
    showPage("ocr", "#record-ocrKey");
    $("#record-ocrKey")?.scrollIntoView({ block: "nearest" });
  },
  "add-exclusion": () => addExclusions($("#excluded-app").value),
  "remove-exclusion": (index) => {
    state.exclusion.splice(Number(index), 1);
    refreshExcluded();
    $("#excluded-app").focus();
  },
  "save-exclusions": () => {
    prefs.excluded = [...state.exclusion];
    $("#save-exclusions").disabled = true;
    setFeedback("keys", "已应用排除列表。");
  },
  "browse-browser": () => pickFile(".exe", (file) => {
    state.browserPath = `C:\\Program Files\\${file.name}`;
    if (state.page === "browser") refresh("#browser-path");
  }),
  "save-browser": applyBrowser,
  "clear-history": () => {
    state.historyQuery = state.historySource = "";
    state.historyPage = 0;
    refresh("#history-query");
  },
  "history-page": (direction) => {
    state.historyPage += Number(direction);
    updateHistory();
    const row = $("[data-history-row]");
    row?.focus({ preventScroll: true });
    row?.scrollIntoView({ block: "start" });
  },
  "repeat-search": (id) => actOnHistory("repeat-search", id),
  "delete-history": (id) => actOnHistory("delete-history", id),
  "browse-ocr": chooseModelFolder,
  "apply-ocr": () => validateModel(false),
  "choose-config": chooseConfig,
  "import-config": () => pickFile(".json,application/json", (file) => importConfig(file, false)),
  "export-config": () => downloadJson("yisou-demo-settings.json", { schema: 1, preferences: prefs }),
  "import-engines": () => pickFile(".json,application/json", (file) => importConfig(file, true)),
  "export-engines": () => downloadJson("yisou-demo-engines.json", { schema: 1, engines: prefs.custom, pins: prefs.pins }),
};
for (const name of ["default-engine", "pin-engine", "edit-engine", "delete-engine", "move-up", "move-down"]) {
  actions[name] = (id) => engineAction(name, id);
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!menu.contains(event.target) && button !== state.engineMenu) closeMenu();
  if (!button || button.disabled) return;
  if (button.dataset.edition) setEdition(button.dataset.edition);
  if (button.dataset.sizeChoice) setSize(button.dataset.sizeChoice);
  const action = actions[button.dataset.action];
  if (action) action(button.dataset.value, button);
});
document.addEventListener("submit", (event) => {
  if (event.target.id !== "engine-form") return;
  event.preventDefault();
  engineDraft(false);
});
document.addEventListener("input", (event) => {
  const input = event.target;
  if (input.dataset.draft && state.editor) {
    state.editor[input.dataset.draft] = input.value;
    state.editor.dirty = true;
    if (input.id === "engine-name" || input.id === "engine-color") $("#engine-icon-preview").innerHTML = brand(state.editor);
    if (input.id !== "engine-color") engineFieldError(input.dataset.draft, "");
  }
  if (input.id === "engine-filter") {
    state.engineFilter = input.value;
    $("#engine-list").innerHTML = engineRows();
  }
  if (input.id === "history-query" || input.id === "history-source") {
    if (event.isComposing) return;
    if (input.id === "history-query") state.historyQuery = input.value;
    else state.historySource = input.value;
    state.historyPage = 0;
    clearTimeout(historyTimer);
    historyTimer = setTimeout(updateHistory, 140);
  }
  if (input.id === "browser-path") {
    state.browserPath = input.value;
    $("#save-browser").disabled = !browserChanged();
    $("#browser-error").textContent = "";
  }
  if (input.id === "ocr-path") {
    state.ocrPath = input.value;
    state.ocrStatus = "initial";
    $("#ocr-status").innerHTML = ocrStatusWithActivePath();
    setFeedback("ocr", "");
  }
});
document.addEventListener("change", (event) => {
  const input = event.target;
  if (input.id === "language") {
    state.language = input.value;
    $("#apply-language").disabled = prefs.language === state.language;
  }
  if (input.name === "browser") {
    state.browser = input.value;
    state.feedback.delete("browser");
    refresh(`#browser-${input.value}`);
  }
  if (input.id === "selection-engine") prefs.selectionEngine = input.value;
  if (input.id === "selection-action") prefs.selectionAction = input.value;
});
document.addEventListener("paste", (event) => {
  if (event.target.id !== "excluded-app") return;
  const value = event.clipboardData.getData("text");
  if (!/[,，;\n]/.test(value)) return;
  event.preventDefault();
  addExclusions(value);
});
document.addEventListener("keydown", (event) => {
  if (dialog.open || event.isComposing) return;
  if (state.engineMenu) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeMenu(true);
      return;
    }
    if (event.key === "Tab") {
      closeMenu(true);
      return;
    }
    if (["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) {
      event.preventDefault();
      const buttons = $$("button:not(:disabled)", menu);
      const current = buttons.indexOf(document.activeElement);
      const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 :
        (current + (event.key === "ArrowUp" ? -1 : 1) + buttons.length) % buttons.length;
      buttons[next]?.focus();
      return;
    }
  }
  if (captureKey(event)) return;
  const navigation = event.target.closest(".nav");
  if (navigation && ["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) {
    event.preventDefault();
    const items = $$(".nav", nav);
    const index = items.indexOf(navigation);
    const next = event.key === "Home" ? 0 : event.key === "End" ? items.length - 1 :
      (index + (event.key === "ArrowUp" ? -1 : 1) + items.length) % items.length;
    items[next].focus();
    return;
  }
  if (event.key === "Escape" && state.editor) {
    actions["cancel-engine"]();
    return;
  }
  if (event.key === "Enter" && event.target.id === "excluded-app") {
    event.preventDefault();
    addExclusions(event.target.value);
  }
  const row = event.target.closest("[data-history-row]");
  if (row && event.target === row && ["Enter", "Delete"].includes(event.key)) {
    event.preventDefault();
    actOnHistory(event.key === "Enter" ? "repeat-search" : "delete-history", row.dataset.historyRow);
  }
});
content.addEventListener("scroll", () => closeMenu(), { passive: true });
window.addEventListener("resize", () => closeMenu(true));

document.documentElement.lang = uiLanguage();
drawChrome();
refresh();
</script>
</body>
</html>
