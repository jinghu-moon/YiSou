[package]
name = "yisou"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "YiSou"
path = "src/main.rs"

[features]
ocr = [
    "dep:rapid-structure-rs",
    "dep:sha2",
    "windows/Win32_UI_Shell",
]
ocr-ui-test = ["ocr"]
text-render-lab = []

[[example]]
name = "ocr_bench"
required-features = ["ocr"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
miniz_oxide = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
yisou_svg = { path = "svg" }

[build-dependencies]
embed-resource = "3.0.12"
miniz_oxide = "0.8.9"
yisou_svg = { path = "svg" }

[target.'cfg(windows)'.dependencies]
rapid-structure-rs = { git = "https://github.com/jinghu-moon/rapid-structure-rs.git", rev = "8a485500dd8a42f1a5a0a2393646ae785fb024e8", default-features = false, features = ["ort-runtime"], optional = true }
sha2 = { version = "0.10", optional = true }
win-icon-extractor = { version = "0.3.0", default-features = false }
windows-numerics = "0.3"
windows-core = "0.62"
windows = { version = "0.62.2", features = [
    "Graphics_DirectX",
    "Graphics_Effects",
    "System",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Accessibility",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
members = ["svg"]
default-members = ["."]
exclude = ["prototypes/nsh"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
